<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Trip Cache</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #211a16;
      --muted: #6d6259;
      --paper: #f7f2e9;
      --line: rgba(45, 34, 24, .15);
      --olive: #3d6049;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(520px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      background: rgba(255, 251, 244, .9);
    }

    h1 {
      margin: 0 0 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 8vw, 3.5rem);
      line-height: .95;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.55;
    }

    .status {
      min-height: 28px;
      margin-bottom: 18px;
      color: var(--ink);
      font-weight: 800;
    }

    a,
    button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      padding: 10px 16px;
      color: #fffaf0;
      background: var(--ink);
      font: inherit;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
    }

    a.secondary {
      margin-left: 8px;
      color: var(--ink);
      background: transparent;
      border-color: var(--line);
    }
  </style>
</head>
<body>
  <main>
    <h1>Reset trip cache</h1>
    <p>This clears the site cache and service worker, then reloads the latest trip files. It does not erase notes or reactions saved in this browser.</p>
    <p class="status" id="status">Ready.</p>
    <button id="resetButton" type="button">Reset cache</button>
    <a class="secondary" href="./today/">Open Today</a>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const button = document.getElementById('resetButton');

    async function resetTripCache() {
      button.disabled = true;
      statusEl.textContent = 'Clearing cached trip files...';

      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }

      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      }

      statusEl.textContent = 'Cache reset. Opening the latest Today page...';
      window.location.replace(`./today/?fresh=${Date.now()}`);
    }

    button.addEventListener('click', () => {
      resetTripCache().catch(() => {
        button.disabled = false;
        statusEl.textContent = 'Reset failed. Try a browser hard reload.';
      });
    });
  </script>
</body>
</html>
