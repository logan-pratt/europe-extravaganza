<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trip Submissions · Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">✦ Trip Admin</div>
    <button id="logoutBtn" class="btn" style="display:none">Sign out</button>
  </header>

  <main>
    <section id="loginView">
      <div class="login-card">
        <h1>Admin login</h1>
        <p class="muted">Sign in with your Supabase account to view submissions.</p>
        <form id="loginForm">
          <label>
            Email
            <input type="email" id="loginEmail" autocomplete="email" required />
          </label>
          <label>
            Password
            <input type="password" id="loginPassword" autocomplete="current-password" required />
          </label>
          <button class="btn primary" type="submit">Sign in</button>
          <p id="loginError" class="error" style="display:none"></p>
        </form>
      </div>
    </section>

    <section id="submissionsView" style="display:none">
      <div class="page-head">
        <h1>Trip submissions</h1>
        <div class="filter-row">
          <div class="tab-row" id="tripTabs">
            <button class="tab active" data-trip="all">All</button>
            <button class="tab" data-trip="dublin">Dublin</button>
            <button class="tab" data-trip="london">London</button>
            <button class="tab" data-trip="lisbon">Lisbon</button>
            <button class="tab" data-trip="galway">Galway</button>
          </div>
          <div class="tab-row" id="statusTabs">
            <button class="tab active" data-status="all">All statuses</button>
            <button class="tab" data-status="new">New</button>
            <button class="tab" data-status="reviewed">Reviewed</button>
            <button class="tab" data-status="archived">Archived</button>
          </div>
        </div>
      </div>
      <div id="submissionsList"></div>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../shared/supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
